name: CI

on:
  push:
    branches: [main, master, clean-main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Pytest (fast layer, no slow sims)
        env:
          DOUPE_JUNIT: reports/junit-backend.xml
        run: |
          mkdir -p reports
          python -m pip install pytest-timeout
          python -m pytest -q -m "not slow" --junitxml=reports/junit-backend.xml
      - name: Upload pytest JUnit (backend)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: reports/junit-backend.xml
          if-no-files-found: ignore

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doupe
          POSTGRES_PASSWORD: doupe
          POSTGRES_DB: doupedraka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doupe -d doupedraka"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://doupe:doupe@localhost:5432/doupedraka
      PYTEST_DATABASE_URL: postgresql+asyncpg://doupe:doupe@localhost:5432/doupedraka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Verify database matches Alembic head
        run: alembic check
      - name: Pytest on PostgreSQL
        env:
          DOUPE_JUNIT: reports/junit-postgres.xml
        run: |
          mkdir -p reports
          python -m pip install pytest-timeout
          python -m pytest -q tests/test_concurrency.py tests/test_alembic_v005.py tests/test_alembic_cd64_token_hash.py --junitxml=reports/junit-postgres.xml
      - name: Upload pytest JUnit (postgres)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-postgres
          path: reports/junit-postgres.xml
          if-no-files-found: ignore

  backend-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest slow layer
        run: |
          mkdir -p reports
          python -m pytest -q -m slow --junitxml=reports/junit-slow.xml
      - name: Upload pytest JUnit (slow)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-slow
          path: reports/junit-slow.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          cd frontend && npm ci
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium
        timeout-minutes: 5
      - name: Playwright cache status
        run: |
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
      - name: Playwright E2E
        env:
          # setup-python puts a clean interpreter on PATH; run-tests pins it via E2E_PYTHON.
          E2E_PYTHON: python
        run: cd frontend && npm run test:e2e
        timeout-minutes: 20
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/.playwright-results/
          if-no-files-found: ignore
