version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
