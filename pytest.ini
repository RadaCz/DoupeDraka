[pytest]
# Root-of-repo import path so `python -m pytest` finds the `app` package
# without manually setting PYTHONPATH.
pythonpath = .
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Per-test wall clock (pytest-timeout). Slow sims override via @pytest.mark.timeout.
timeout = 120
timeout_method = thread

markers =
    unit: fast deterministic tests without full engine journey (Sprint 28 layer).
    integration: engine + persistence or API auth/idempotency paths (Sprint 28 layer).
    slow: parametrized story sims and other multi-minute runs — excluded from fast diagnostic.
    regress: sprint gameplay contract regressions (subset selector for scripts/CI).

filterwarnings =
    default

# Optional JUnit (CI / scripts set DOUPE_JUNIT=reports/junit.xml).
junit_family = xunit2
